<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}RAGSPLOIT{% endblock %} :: RAGSPLOIT</title>
<style>
  :root{
    --bg:#0d0d0d; --panel:#141414; --panel2:#1b1b1b; --border:#2a2a2a;
    --green:#50fa7b; --green-d:#2f8f4e; --cyan:#8be9fd; --purple:#bd93f9;
    --pink:#ff79c6; --yellow:#f1fa8c; --red:#ff5555; --fg:#d7d7d7; --muted:#8a8a8a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:'Consolas','Monaco','SFMono-Regular',monospace;line-height:1.5}
  a{color:var(--cyan);text-decoration:none}
  a:hover{text-decoration:underline}
  header{border-bottom:2px solid var(--green);background:var(--panel);
         padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  header .brand{color:var(--green);font-weight:bold;font-size:18px;letter-spacing:2px}
  nav{display:flex;gap:6px;flex-wrap:wrap}
  nav a{padding:6px 12px;border:1px solid var(--border);border-radius:6px;color:var(--fg)}
  nav a:hover{border-color:var(--green);text-decoration:none;color:var(--green)}
  nav a.active{background:var(--green-d);border-color:var(--green);color:#05140a}
  .statusbar{margin-left:auto;font-size:12px;color:var(--muted)}
  .statusbar b{color:var(--cyan)}
  main{max-width:1100px;margin:0 auto;padding:24px 20px}
  h1{color:var(--green);border-bottom:1px solid var(--border);padding-bottom:8px;font-size:22px}
  h2{color:var(--purple);font-size:16px;margin-top:28px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;
         padding:18px;margin:16px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:16px}
  .card .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}
  .card .v{color:var(--green);font-size:18px;margin-top:4px;word-break:break-all}
  label{display:block;color:var(--muted);font-size:12px;margin:12px 0 4px}
  select,input[type=text],input[type=password]{width:100%;background:#0a0a0a;color:var(--fg);
         border:1px solid var(--border);border-radius:6px;padding:9px 10px;font:inherit}
  select:focus,input:focus{outline:none;border-color:var(--green)}
  button,.btn{background:var(--green-d);color:#05140a;border:1px solid var(--green);
         border-radius:6px;padding:9px 16px;font:inherit;font-weight:bold;cursor:pointer}
  button:hover,.btn:hover{background:var(--green);text-decoration:none}
  button.ghost{background:transparent;color:var(--fg);border-color:var(--border)}
  button.ghost:hover{border-color:var(--green);color:var(--green);background:transparent}
  button.danger{background:transparent;color:var(--red);border-color:var(--red)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .row>*{flex:1;min-width:160px}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid}
  .pill.ok{color:var(--green);border-color:var(--green-d)}
  .pill.no{color:var(--red);border-color:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:normal;font-size:12px;text-transform:uppercase}
  .msg{margin:10px 0;padding:10px 12px;border-radius:6px;font-size:13px;display:none}
  .msg.ok{display:block;background:#0f2417;border:1px solid var(--green-d);color:var(--green)}
  .msg.err{display:block;background:#2a1012;border:1px solid var(--red);color:var(--red)}
  .hint{color:var(--muted);font-size:12px}
  code{color:var(--yellow)}
</style>
{% block head %}{% endblock %}
</head>
<body>
<header>
  <span class="brand">RAGSPLOIT</span>
  <nav>
    <a href="/" class="{{ 'active' if nav=='index' }}">Dashboard</a>
    <a href="/config" class="{{ 'active' if nav=='config' }}">Config</a>
    <a href="/run" class="{{ 'active' if nav=='run' }}">Run</a>
    <a href="/reports" class="{{ 'active' if nav=='reports' }}">Reports</a>
    <a href="/knowledge" class="{{ 'active' if nav=='knowledge' }}">Knowledge</a>
  </nav>
  <span class="statusbar">
    TARGET <b>{{ st.target }}</b> · MODEL <b>{{ st.model_short or '—' }}</b>
    · PROVIDER <b>{{ st.provider }}</b>
  </span>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
