networks:
  llm-rag_labnet:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.70.0/24

services:
  core:
    build:
      context: .
      dockerfile: ./core/Dockerfile
    image: ragsploit/core:latest
    container_name: core_orchestrator
    # TRUQUE PARA MANTER O CONTAINER VIVO:
    command: tail -f /dev/null
    tty: true
    stdin_open: true
    depends_on:
      - atk
      - tgt
      - localai-proxy
    networks:
      llm-rag_labnet:
        ipv4_address: 192.168.70.10
    volumes:
      - ./data/vectorstore:/app/data
      - ./src:/app/src
      - ./config:/app/config
    environment:
      # VARIAVEIS CORRIGIDAS (SEM A BARRA INVERTIDA):
      LAB_LLM_URL: ${LAB_LLM_URL}
      CHROMA_PERSIST_DIR: /app/data
      ATK_RPC_URL: http://192.168.70.20:55553
      NVD_API_KEY: ${NVD_API_KEY}
      AUTO_INGEST: "false"
      MSF_RPC_PASSWORD: ${MSF_RPC_PASSWORD:-msfpass}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  atk:
    build: ./atk
    container_name: metasploit_atk
    environment:
      MSF_RPC_PASSWORD: ${MSF_RPC_PASSWORD:-msfpass}
    networks:
      llm-rag_labnet:
        ipv4_address: 192.168.70.20
    ports:
      - "55553:55553"
    volumes:
      # Wordlists compartilhadas: o login scanner do MSF le USERPASS_FILE
      # neste caminho (mesmo path do pipeline), permitindo brute-force em
      # UMA execucao sobre a wordlist inteira.
      - ./data/vectorstore/wordlists:/app/data/wordlists

  tgt:
    build: ./tgt
    container_name: vulnerable_tgt
    tty: true 
    networks:
      llm-rag_labnet:
        ipv4_address: 192.168.70.30
    ports:
      - "8081:80"   
      - "2121:21"   
      - "2222:22"   
      - "2323:23"   

  localai-proxy:
    build: ./llm_proxy
    container_name: llm_proxy
    networks:
      llm-rag_labnet:
        ipv4_address: 192.168.70.40
    env_file:
      - .env
    volumes:
      - ./llm_proxy:/app
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Web UI (operacao pelo navegador). SEGURANCA: publish restrito a 127.0.0.1
  # (nunca 0.0.0.0 publico) + auth basica. Herda a imagem do core (deps do
  # pipeline) e lanca o pipeline em PTY para o terminal interativo no browser.
  webui:
    build:
      context: .
      dockerfile: ./webui/Dockerfile
    image: ragsploit/webui:latest
    container_name: ragsploit_webui
    depends_on:
      - core
      - atk
      - tgt
      - localai-proxy
    networks:
      llm-rag_labnet:
        ipv4_address: 192.168.70.60
    ports:
      - "127.0.0.1:8090:8090"
    env_file:
      - .env
    environment:
      LAB_LLM_URL: ${LAB_LLM_URL}
      CHROMA_PERSIST_DIR: /app/data
      ATK_RPC_URL: http://192.168.70.20:55553
      NVD_API_KEY: ${NVD_API_KEY}
      MSF_RPC_PASSWORD: ${MSF_RPC_PASSWORD:-msfpass}
      WEBUI_USER: ${WEBUI_USER:-admin}
      WEBUI_PASS: ${WEBUI_PASS:-ragsploit}
      WEBUI_PORT: "8090"
      # Scheduler de CVEs (#4): atualiza a base a cada N horas.
      CVE_AUTO_UPDATE: ${CVE_AUTO_UPDATE:-true}
      CVE_UPDATE_HOURS: ${CVE_UPDATE_HOURS:-12}
      CVE_RUN_AT_START: ${CVE_RUN_AT_START:-false}
    volumes:
      - ./data/vectorstore:/app/data
      - ./src:/app/src
      - ./config:/app/config
      - ./.env:/app/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
